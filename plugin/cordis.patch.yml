# Bundle patch contributed by dsh-web-search-yandex: mounts the provider plugin
# into the profile. Selecting it as the search provider is a separate, profile
# level decision (the profile patch overrides the `web` row's searchProvider to
# `yandex` and disables the default DeepSeek provider — see the main README,
# "Вариант B").
- id: web-search-yandex
  name: dsh-web-search-yandex
  inject: [web]
  config:
    apiKeyEnv: YANDEX_API_KEY
    folderIdEnv: YANDEX_FOLDER_ID
